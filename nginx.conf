# Внутрішній вебсервер за Caddy: HTTPS термінує Caddy (Caddyfile), сюди приходить
# лише HTTP з compose-мережі. Назовні цей порт не опублікований.

# Справжня адреса клієнта — з X-Forwarded-For, який ставить Caddy. Без цього всі
# запити виглядали б як від Caddy, і rate limit став би спільним на всіх.
set_real_ip_from 172.16.0.0/12;
set_real_ip_from 10.0.0.0/8;
set_real_ip_from 192.168.0.0/16;
real_ip_header X-Forwarded-For;

limit_req_zone $binary_remote_addr zone=api:10m rate=20r/s;

server {
    listen 80;
    server_name _;

    server_tokens off;
    client_max_body_size 16k;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # Фронт живе окремо (GitHub Pages); тут — лише API.
    location / {
        return 404;
    }

    # Ручний запуск парсингу закритий ззовні: інакше будь-хто міг би смикати
    # Telegram у циклі й підвести акаунт під flood-бан. Запуск — із сервера
    # (docs/deploy.md); за розкладом парсер і так ходить кожні 15 хв.
    location = /api/update {
        return 403;
    }

    location /api/ {
        limit_req zone=api burst=60 nodelay;
        limit_req_status 429;

        proxy_pass http://backend:5001;
        proxy_hide_header X-Powered-By;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 30s;
    }
}
