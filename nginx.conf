# Публічна точка входу. TLS термінує Tailscale Funnel перед nginx, тому тут
# лише HTTP, і назовні цей порт відкритий тільки на localhost (див. docker-compose.yml).
# Перехід на власний домен — certbot + `listen 443 ssl` замість Funnel.

# За Funnel усі запити приходять з однієї адреси, тож ліміт працює як
# глобальний запобіжник для слабкого сервера, а не як ліміт на клієнта.
limit_req_zone $binary_remote_addr zone=api:10m rate=20r/s;

server {
    listen 80;
    server_name _;

    server_tokens off;
    client_max_body_size 16k;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    gzip on;
    gzip_types application/json text/css application/javascript image/svg+xml;
    gzip_min_length 1024;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Файли Vite мають хеш в імені — їх можна кешувати назавжди.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options nosniff always;
        try_files $uri =404;
    }

    # Ручний запуск парсингу закритий ззовні: інакше будь-хто міг би смикати
    # Telegram у циклі й підвести акаунт під flood-бан. Запуск — із сервера
    # (docs/deploy-beta.md); за розкладом парсер і так ходить кожні 15 хв.
    location = /api/update {
        return 403;
    }

    location /api/ {
        limit_req zone=api burst=60 nodelay;
        limit_req_status 429;

        proxy_pass http://backend:5001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 30s;
    }
}
