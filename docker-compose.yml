# Логи на SD-картці ARM-сервера не мають рости без меж.
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  backend:
    build: ./backend-js
    # Лише всередині compose-мережі: назовні API доступне тільки через nginx.
    expose:
      - "5001"
    volumes:
      # Несекретна частина конфігу (канали, інтервали), лише для читання.
      - ./backend-js/config.json:/app/config.json:ro
      # Сесія Telegram; створюється при першому інтерактивному вході.
      - ./backend-js/secrets:/app/secrets
    env_file:
      - .env
    environment:
      - PORT=5001
      - MONGODB_URI=mongodb://mongo:27017
    depends_on:
      - mongo
    restart: unless-stopped
    logging: *logging

  proxy:
    image: nginx:stable-alpine
    # Правила доступу до API (nginx.conf). Лише всередині compose-мережі:
    # назовні доступ лише через Caddy (HTTPS).
    expose:
      - "80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
    restart: unless-stopped
    logging: *logging

  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"      # Let's Encrypt HTTP-01 і редірект на HTTPS
      - "443:443"
      - "443:443/udp" # HTTP/3
    environment:
      - DOMAIN=${DOMAIN:-localhost}
      - DEV_DOMAIN=${DEV_DOMAIN:-dev.localhost}
    networks:
      - default
      # Через цю мережу Caddy бачить dev-стек (deploy/compose.dev.yml).
      - edge
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # Сертифікати й ключі ACME-акаунта: без тому Caddy перевипускав би їх при кожному
      # перезапуску й швидко вперся б у ліміти Let's Encrypt.
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - proxy
    restart: unless-stopped
    logging: *logging

  mongo:
    image: mongo:7
    # WiredTiger за замовчуванням бере близько половини RAM. 1 ГБ вистачає з запасом для наших даних
    # і з місцем під майбутні Python-сервіси на Oracle (12 ГБ).
    command: ["--wiredTigerCacheSizeGB", "1"]
    volumes:
      - mongo_data:/data/db
    restart: unless-stopped
    logging: *logging

networks:
  edge:
    name: light-ua-edge

volumes:
  mongo_data:
  caddy_data:
  caddy_config:
