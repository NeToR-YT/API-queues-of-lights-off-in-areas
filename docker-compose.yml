# Логи на SD-картці ARM-сервера не мають рости без меж.
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  backend:
    build: ./backend-js
    # Лише всередині compose-мережі: назовні API доступне тільки через nginx.
    expose:
      - "5001"
    volumes:
      # Несекретна частина конфігу (канали, інтервали) — read-only.
      - ./backend-js/config.json:/app/config.json:ro
      # Сесія Telegram; створюється при першому інтерактивному вході.
      - ./backend-js/secrets:/app/secrets
    env_file:
      - .env
    environment:
      - PORT=5001
      - MONGODB_URI=mongodb://mongo:27017
    depends_on:
      - mongo
    restart: unless-stopped
    logging: *logging

  frontend:
    build: ./frontend
    ports:
      # Тільки localhost. Публічний HTTPS дає Tailscale Funnel: `tailscale funnel --bg 8080`.
      - "127.0.0.1:8080:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
    restart: unless-stopped
    logging: *logging

  mongo:
    image: mongo:7
    # WiredTiger за замовчуванням бере ~50% RAM — на слабкому сервері це головний пожирач пам'яті.
    command: ["--wiredTigerCacheSizeGB", "0.25"]
    volumes:
      - mongo_data:/data/db
    restart: unless-stopped
    logging: *logging

volumes:
  mongo_data:
